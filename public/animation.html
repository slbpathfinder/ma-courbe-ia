<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Écran animatrice · Ma courbe face à l'IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F5FE;--card:#fff;--ink:#2E3862;--soft:#5A628C;--accent:#FF6136;--lav:#B9CCFF;--violet:#4E549F;--line:#D5DDF5;--f:"Poppins","Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f)}
.bar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar h1{font-size:17px;margin:0 16px 0 0}
.bar button,.bar select,.bar input{font:inherit;font-size:13px;border-radius:999px;padding:6px 12px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.bar select option{color:#000}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.bar .sp{flex:1}
.live{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;color:var(--ink)}
.live.on{background:var(--accent);color:#fff}
main{padding:24px 28px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}
.head h2{font-size:30px;margin:0}
.head .count{font-size:18px;color:var(--soft)}
.words{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 26px;background:#fff;border-radius:18px;padding:36px 32px;min-height:46vh;align-content:center;margin-bottom:16px}
.words span{font-weight:700;line-height:1.1;white-space:nowrap}
.tog{text-align:right;margin:0 0 14px}
.tog button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.c{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 0 var(--line);position:relative;font-size:17px}
.c .g{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.c ol,.c ul{margin:0;padding-left:20px;display:grid;gap:4px}
.c .hide{position:absolute;top:8px;right:8px;font:inherit;font-size:11px;border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:999px;padding:2px 8px;cursor:pointer}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:end;height:52vh;max-height:460px}
.b{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:8px}
.b .n{font-size:30px;font-weight:700}
.b .col{display:flex;align-items:flex-end;background:#fff;border-radius:14px;overflow:hidden}
.b .fill{width:100%;background:var(--lav);border-radius:14px 14px 0 0}
.b.top .fill{background:var(--accent)}
.b .lbl{font-weight:600;font-size:18px}
.empty{color:var(--soft);font-size:18px;padding:40px 0}
.info{font-size:15px;color:var(--soft);max-width:70ch;line-height:1.6}
.err{color:#C0392B;font-weight:600}
.msg{margin:0;padding:10px 28px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.msg.bad{color:#C0392B}
</style>
</head>
<body>
<div class="bar">
  <h1>Écran animatrice</h1>
  <select id="session" aria-label="Session">
    <option value="LIVE">Atelier en cours</option>
    <option value="TEST">Test</option>
  </select>
  <span id="moments"></span>
  <span class="sp"></span>
  <button type="button" id="push">Afficher cette étape aux participants</button>
  <span class="live" id="live">Aucun moment imposé</span>
  <button type="button" id="release">Libérer</button>
  <button type="button" id="export">Exporter</button>
  <button type="button" id="reset">Exporter puis vider</button>
</div>
<p id="msg" class="msg" hidden></p>
<main id="main"><p class="info">Chargement…</p></main>
<script>
const MOMENTS=[["ouverture","1 Ce qui m'occupe l'esprit"],["d1","2 Discussion 1 · déroulé"],["ingredients","3 Discussion 1 · retours"],["phase","4 Où j'en suis"],["d2","5 Discussion 2 · déroulé"],["pratiques","6 Discussion 2 · retours"],["pas","7 Petit pas"]];
const DATA=["ouverture","ingredients","phase","pratiques"];
const PH=["Choc et déni","Colère et peur","Le creux","Rebond et sens"];
const STOP=new Set("le la les de des du un une et en à a au aux l d qu que qui est c ce cet cette ces sur pour par avec dans mon ma mes notre nos son sa ses leur leurs plus pas ne se s on il elle ils je j me m nous vous y tout tous très bien sans entre comme mais donc car aussi encore quand être avoir fait faire cela ça celui celle peu beaucoup moins trop chez ainsi dont lui leur notre votre nouveau nouvelle nouveaux nouvelles nouvel changement changements aujourd'hui".split(" "));
const q=new URLSearchParams(location.search);
let key=q.get("key")||(()=>{try{return localStorage.getItem("mc-key")}catch{return null}})()||"";
try{if(q.get("key"))localStorage.setItem("mc-key",key)}catch{}
let session=(()=>{try{return localStorage.getItem("mc-sess")}catch{return null}})()||"LIVE";
if(!["LIVE","TEST"].includes(session))session="LIVE";
let moment="ouverture",showCards=false;
const KEEP=new Set(["ia","rh","ux","bi"]);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#session").value=session;
$("#session").onchange=e=>{session=e.target.value;try{localStorage.setItem("mc-sess",session)}catch{};refresh();state()};
function renderMoments(){$("#moments").innerHTML=MOMENTS.map(([id,l])=>`<button type="button" data-m="${id}" aria-pressed="${id===moment}">${l}</button>`).join(" ");
  document.querySelectorAll("#moments button").forEach(b=>b.onclick=()=>{moment=b.dataset.m;renderMoments();refresh()})}
async function admin(body){const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({key,session,...body})});return r.ok?r.json():Promise.reject(r.status)}
$("#push").onclick=async()=>{await admin({action:"active",active:moment}).catch(()=>alertMsg("Clé animatrice refusée."));state()};
$("#release").onclick=async()=>{await admin({action:"active",active:null}).catch(()=>{});state()};
const NAMES={ouverture:"Ce qui m'occupe le plus l'esprit",ingredients:"Discussion 1 · nos ingrédients",phase:"Où j'en suis",pratiques:"Discussion 2 · nos pratiques",conclusion:"Conclusion · mon learning"};
async function exportAll(){
  const lines=[["Moment","Sous-groupe","Réponse 1","Réponse 2","Réponse 3","Heure"]];let total=0;
  for(const mo of DATA){const r=await fetch(`/api/results?session=${session}&moment=${mo}&key=${encodeURIComponent(key)}`,{cache:"no-store"});
    if(!r.ok)throw new Error("export");const rows=(await r.json()).rows||[];total+=rows.length;
    rows.forEach(x=>{const items=mo==="phase"?[PH[x.phase-1]||""]:(x.items||[]);
      lines.push([NAMES[mo],x.group||"",items[0]||"",items[1]||"",items[2]||"",new Date(x.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})])})}
  const csv="\ufeff"+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  const name=`atelier-courbe-${session==="TEST"?"test-":""}${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}h${pad(d.getMinutes())}.csv`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  return total;
}
$("#export").onclick=async()=>{try{const n=await exportAll();infoMsg(n+" réponses exportées dans le fichier téléchargé.")}catch{alertMsg("Export impossible. Vérifiez la clé et la connexion.")}};
$("#reset").onclick=()=>{
  if($("#confirm"))return;
  $("#main").insertAdjacentHTML("afterbegin",`<div class="c" id="confirm">Toutes les réponses ${session==="TEST"?"de test":"de l'atelier en cours"} vont être téléchargées dans un fichier, puis effacées du site. <button id="cfok" type="button">Exporter et vider</button> <button id="cfno" type="button">Annuler</button></div>`);
  $("#cfno").onclick=()=>$("#confirm").remove();
  $("#cfok").onclick=async()=>{let n;try{n=await exportAll()}catch{$("#confirm").remove();alertMsg("Export impossible, rien n'a été effacé.");return}
    await new Promise(r=>setTimeout(r,800));
    try{await admin({action:"reset",confirm:session});await admin({action:"active",active:null})}catch{$("#confirm").remove();alertMsg("Export fait, mais l'effacement a échoué. Réessayez.");return}
    $("#confirm").remove();infoMsg(n+" réponses exportées puis effacées. Le site est prêt pour l'atelier suivant.");refresh();state()};
};
function infoMsg(t){const m=$("#msg");m.hidden=false;m.className="msg";m.textContent=t}
function alertMsg(t){const m=$("#msg");m.hidden=false;m.className="msg bad";m.textContent=t}
async function state(){try{const r=await fetch("/api/state?session="+session,{cache:"no-store"});const {active}=await r.json();
  const lab=(MOMENTS.find(m=>m[0]===active)||[])[1];$("#live").textContent=active?"Participants sur : "+lab:"Aucun moment imposé";$("#live").classList.toggle("on",!!active)}catch{}}
async function hide(k){await admin({action:"hide",target:k}).catch(()=>{});refresh()}
function norm(x){return String(x||"").normalize("NFC").replace(/[’`]/g,"'").toLowerCase().replace(/\s+/g," ").trim().replace(/[\s.!?;:,…"«»]+$/g,"").replace(/^[«"\s]+/,"").replace(/^(l'|d'|la |le |les |un |une |des |du |de la |de l'|mon |ma |mes |notre |nos )/,"").trim()}
function show(k){k=k.replace(/\bia\b/g,"IA").replace(/\brh\b/g,"RH").replace(/\br&d\b/g,"R&D");return k.charAt(0).toUpperCase()+k.slice(1)}
function words(rows){const c={};rows.forEach(r=>(r.items||[]).forEach(x=>{const k=norm(x);if(k.length>1)c[k]=(c[k]||0)+1}));
  const all=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));if(!all.length)return"";const top=all.slice(0,60),rest=all.length-top.length,max=top[0][1];
  const line=[];top.forEach((t,i)=>i%2?line.push(t):line.unshift(t));
  const COL=["var(--violet)","var(--accent)","#1F2A55","#5B6BB5","#E08A2E"];const h=w=>[...w].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  return`<div class="words">${line.map(([w,n])=>`<span title="${n}" style="font-size:${max>1?Math.round(18+52*(n-1)/(max-1)):26}px;color:${COL[h(w)%COL.length]}">${esc(show(w))}</span>`).join("")}</div>`+(rest>0?`<p class="info">Le nuage montre les 60 mots clés les plus cités. ${rest} autre${rest>1?"s":""} dans « Voir les réponses ».</p>`:"")}
async function refresh(){
  const m=$("#main"),title=(MOMENTS.find(x=>x[0]===moment)||[])[1];
  if(!key){m.innerHTML=`<p class="info">Ouvrez cette page avec votre clé : <b>…/animation.html?key=VOTRE_CLÉ</b></p>`;return}
  if(!DATA.includes(moment)){m.innerHTML=`<div class="head"><h2>${esc(title)}</h2></div><p class="info">Cette étape n'a pas de réponses à afficher. Utilisez « Afficher cette étape aux participants » pour amener tous les téléphones sur cette étape.</p>`;return}
  let rows;try{const r=await fetch(`/api/results?session=${session}&moment=${moment}&key=${encodeURIComponent(key)}`,{cache:"no-store"});
    if(r.status===401){m.innerHTML=`<p class="err">Clé animatrice refusée. Vérifiez le lien.</p>`;return}rows=(await r.json()).rows||[]}catch{return}
  if(moment==="phase"){const n=[0,0,0,0];rows.forEach(r=>n[r.phase-1]++);const tot=n.reduce((a,b)=>a+b,0),max=Math.max(1,...n);
    m.innerHTML=`<div class="head"><h2>Où en sommes-nous face à l'IA et à la transformation du pôle Notaire ?</h2><span class="count">${tot} réponse${tot>1?"s":""}</span></div>`+
    `<div class="bars">${n.map((v,i)=>`<div class="b ${v===max&&v>0?"top":""}"><div class="n">${tot?Math.round(100*v/tot):0} %</div><div class="col"><div class="fill" style="height:${100*v/max}%"></div></div><div class="lbl">${PH[i]}</div></div>`).join("")}</div>`;return}
  const head=`<div class="head"><h2>${moment==="ouverture"?"Ce qui nous occupe le plus l'esprit":moment==="ingredients"?"Discussion 1 · Nos ingrédients du changement":moment==="conclusion"?"Nos learnings les plus utiles aujourd'hui":"Discussion 2 · Nos pratiques pour avancer"}</h2><span class="count">${rows.length} réponse${rows.length>1?"s":""}</span></div>`;
  if(!rows.length){m.innerHTML=head+`<p class="empty">Les réponses apparaîtront ici au fil de l'eau.</p>`;return}
  const cards=rows.map(r=>`<div class="c">${r.group?`<div class="g">Sous-groupe ${esc(r.group)}</div>`:""}${(r.items||[]).length>1?`<ol>${r.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`:esc((r.items||[""])[0])}<button class="hide" type="button" data-k="${esc(r.key)}">masquer</button></div>`).join("");
  const cloud=moment==="ouverture"||moment==="conclusion";
  m.innerHTML=head+(cloud?words(rows)+`<p class="tog"><button type="button" id="tog">${showCards?"Masquer les réponses":"Voir les réponses"}</button></p>`:"")+(!cloud||showCards?`<div class="grid">${cards}</div>`:"");
  if($("#tog"))$("#tog").onclick=()=>{showCards=!showCards;refresh()};
  document.querySelectorAll(".hide").forEach(b=>b.onclick=()=>hide(b.dataset.k));
}
renderMoments();refresh();state();setInterval(()=>{if(!document.getElementById("confirm")){refresh()}state()},4000);
</script>
</body>
</html>
